# Dependabot Auto-Merge
# Automatically approves and merges Dependabot PRs after CI passes
#
# This workflow calls the centralized auto-merge workflow from zircote/.github
# Requires repository setting "Allow auto-merge" to be enabled

name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    uses: zircote/.github/.github/workflows/reusable-dependabot-automerge.yml@6d55ba68dd1c7bff34e3b77a25d279949eb8a3bf # pin to main SHA
    secrets: inherit
