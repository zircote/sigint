# Dependabot Auto-Merge
# Automatically approves and merges Dependabot PRs after CI passes
#
# This workflow calls the centralized auto-merge workflow from zircote/.github
# Requires repository setting "Allow auto-merge" to be enabled

name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    uses: zircote/.github/.github/workflows/reusable-dependabot-automerge.yml@98cdea888a91e42874418e7173a265d6a546bc27 # pin to main SHA
    secrets: inherit
